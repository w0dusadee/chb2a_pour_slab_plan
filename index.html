<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHB2A-DOLPHIN | FSA-DCH Concrete Pour Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0b2440;
    --navy-2:#123258;
    --paper:#f4f1e8;
    --paper-line:#c9c2ab;
    --blue-deep:#5b7cc0;
    --yellow-deep:#e0c94a;
    --red:#c0392b;
    --ink:#0b2440;
    --muted:#5c6b7a;
    --white:#ffffff;
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--navy);
    font-family:'IBM Plex Mono',monospace;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  header{
    background:linear-gradient(180deg,var(--navy) 0%, var(--navy-2) 100%);
    color:var(--paper);
    padding:10px 16px 10px;
    border-bottom:3px solid var(--yellow-deep);
    flex:0 0 auto;
    position:relative;
    z-index:100;
  }
  .eyebrow{
    font-size:10px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:#8ea9db;
    margin:0 0 3px;
  }
  h1{ margin:0; font-size:16px; font-weight:600; letter-spacing:.005em; }
  .toolbar{ display:flex; flex-wrap:wrap; gap:14px; align-items:center; margin-top:8px; }

  .date-picker{ position:relative; }
  .date-btn{
    display:flex; align-items:center; gap:8px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.18);
    padding:5px 9px; border-radius:4px;
    font-size:11px;
    color:var(--paper);
    cursor:pointer;
    font-family:'IBM Plex Mono',monospace;
  }
  .date-btn:hover{ background:rgba(255,255,255,.12); }
  .date-btn b{ font-size:12px; }
  .date-btn .cal-ico{ font-size:12px; opacity:.8; }

  .cal-pop{
    position:absolute;
    top:calc(100% + 6px);
    left:0;
    width:240px;
    background:var(--paper);
    color:var(--ink);
    border-radius:8px;
    box-shadow:0 16px 40px rgba(0,0,0,.4);
    border:1px solid var(--paper-line);
    padding:10px;
    display:none;
    z-index:400;
  }
  .cal-pop.open{ display:block; }
  .cal-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:6px;
  }
  .cal-head button{
    background:none; border:none; cursor:pointer;
    font-size:14px; color:var(--navy); padding:2px 8px;
    border-radius:4px;
  }
  .cal-head button:hover{ background:rgba(11,36,64,.08); }
  .cal-head .cal-title{ font-size:12px; font-weight:700; }
  .cal-grid{
    display:grid; grid-template-columns:repeat(7,1fr);
    gap:2px; font-size:10.5px;
  }
  .cal-grid .dow{ text-align:center; color:var(--muted); font-weight:700; padding:2px 0; }
  .cal-grid .day{
    text-align:center; padding:5px 0; cursor:pointer; border-radius:4px;
  }
  .cal-grid .day:hover{ background:rgba(91,124,192,.25); }
  .cal-grid .day.muted{ color:#b7b0a0; }
  .cal-grid .day.today-marker{ box-shadow:inset 0 0 0 1px var(--blue-deep); }
  .cal-grid .day.selected{ background:var(--navy); color:#f5e07a; font-weight:700; }
  .cal-foot{
    margin-top:8px; text-align:center;
  }
  .cal-foot button{
    background:none; border:none; font-size:10.5px; color:var(--blue-deep);
    cursor:pointer; text-decoration:underline;
  }

  .legend{ display:flex; flex-wrap:wrap; gap:12px; font-size:10.5px; color:#c7d3e2; align-items:center; }
  .legend .row{ display:flex; align-items:center; }
  .legend span.swatch{
    display:inline-block; width:11px; height:11px; border-radius:2px;
    margin-right:5px; vertical-align:-2px; border:1px solid rgba(0,0,0,.2);
  }
  .progress-total{
    margin-left:auto;
    font-size:11px; color:#f5e07a;
    background:rgba(0,0,0,.2); padding:5px 11px; border-radius:4px;
    border:1px solid rgba(255,255,255,.12);
  }

  .stage{
    flex:1 1 auto;
    padding:10px;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    overflow:auto;
  }
  .plan-wrap{
    position:relative;
    background:var(--paper);
    border-radius:4px;
    width:100%;
    max-width:100%;
    margin:0 auto;
    box-shadow:0 8px 24px rgba(0,0,0,.35);
    overflow:hidden;
    line-height:0;
  }
  .plan-wrap img{ display:block; width:100%; height:auto; user-select:none; -webkit-user-drag:none; }

  .hit{
    position:absolute;
    border:1px solid transparent;
    cursor:pointer;
    background-repeat:no-repeat;
    transition:box-shadow .12s ease, filter .12s ease;
    z-index:1;
  }
  .hit:hover{ filter:brightness(0.96); box-shadow:inset 0 0 0 2px rgba(11,36,64,.55); }
  .hit:focus-visible{ outline:none; box-shadow:inset 0 0 0 2px var(--navy); }

  .badge{
    position:absolute;
    top:2px; right:2px;
    font-size:10px;
    font-weight:700;
    padding:.28em .6em;
    border-radius:1em;
    background:rgba(255,255,255,.9);
    color:var(--muted);
    pointer-events:none;
    border:1px solid rgba(0,0,0,.15);
    z-index:3;
    line-height:1.1;
    white-space:nowrap;
  }
  .badge.done{ background:var(--navy); color:#f5e07a; border-color:var(--navy); }

  /* Overlays that sit directly on top of the printed sequence-number box
     and the printed pour-date text, so both stay live/editable-looking. */
  .num-overlay{
    position:absolute;
    background:var(--white);
    border:1.6px solid var(--red);
    border-radius:2px;
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono',monospace;
    font-weight:700;
    color:var(--ink);
    pointer-events:none;
    z-index:2;
    line-height:1;
  }
  .date-overlay{
    position:absolute;
    background:var(--white);
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    color:var(--ink);
    pointer-events:none;
    z-index:2;
    line-height:1;
    white-space:nowrap;
  }
  /* Area label written into the empty space of each panel cell (above the
     sequence-number box). No background box since it isn't covering any
     printed text -- it's new information placed in blank space. */
  .area-overlay{
    position:absolute;
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    color:var(--navy-2);
    pointer-events:none;
    z-index:2;
    line-height:1.15;
    white-space:nowrap;
    text-shadow:0 0 3px var(--paper), 0 0 3px var(--paper), 0 0 5px var(--paper);
  }
  .area-overlay sup{ font-size:.7em; }

  /* Modal */
  .overlay{
    position:fixed; inset:0; background:rgba(11,36,64,.6);
    display:none; align-items:center; justify-content:center;
    z-index:300; padding:18px;
  }
  .overlay.open{ display:flex; }
  .modal{
    background:var(--paper); border-radius:8px; width:100%; max-width:440px;
    max-height:88vh; overflow-y:auto; box-shadow:0 24px 60px rgba(0,0,0,.45);
    border-top:5px solid var(--red);
    font-family:'IBM Plex Mono',monospace;
  }
  .modal-head{
    padding:18px 22px 12px; display:flex; justify-content:space-between;
    align-items:flex-start; border-bottom:1px dashed var(--paper-line);
  }
  .modal-head h2{ margin:0 0 4px; font-size:17px; }
  .modal-head-actions{
    display:flex; flex-direction:column; align-items:flex-end; gap:6px; flex-shrink:0;
  }
  .modal-head-actions-row{
    display:flex; align-items:flex-start; gap:10px;
  }
  .area-volume-info{
    text-align:right; line-height:1.35;
  }
  .area-volume-info p{
    margin:0; font-size:12px; color:var(--muted);
  }
  .modal-head button{
    background:none; border:none; font-size:20px; cursor:pointer;
    color:var(--muted); line-height:1; padding:2px 4px;
  }
  .clear-all-btn{
    font-size:11px !important;
    color:#d1483a !important;
    border:1px solid rgba(209,72,58,.4) !important;
    border-radius:4px;
    padding:5px 9px !important;
    line-height:1.2 !important;
    white-space:nowrap;
  }
  .clear-all-btn:hover{ background:rgba(209,72,58,.12) !important; }
  .clear-all-btn.confirming{
    background:#d1483a !important; color:#fff !important; border-color:#d1483a !important;
  }
  .pour-row{
    display:flex; align-items:center; gap:8px; margin-top:2px;
  }
  .pour-row p{ margin:0; font-size:12px; color:var(--muted); }
  .edit-date-btn{
    font-size:10px; color:var(--blue-deep); background:none; border:none;
    cursor:pointer; text-decoration:underline; padding:0;
  }
  .rank-line{ font-size:11px; color:var(--muted); margin:2px 0 0; }
  .timeline{ padding:16px 22px 22px; }
  .step{ display:flex; gap:12px; padding:10px 0; border-bottom:1px solid #e6e0cc; }
  .step:last-child{
    border-bottom:none; background:rgba(240,201,74,.25);
    margin:0 -22px; padding:12px 22px; border-radius:6px;
  }
  .step .idx{
    font-size:11px; color:var(--white);
    background:var(--blue-deep); width:20px; height:20px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:2px;
  }
  .step:last-child .idx{ background:var(--red); }
  .step .body{ flex:1; }
  .step .label{ font-weight:600; font-size:13px; }
  .step .date{ font-size:12px; color:var(--muted); margin-top:2px; }
  .step .date.overdue{ color:#d1483a; font-weight:700; }
  .step label.chk{ display:flex; align-items:center; gap:6px; cursor:pointer; }
  .step input[type=checkbox]{ width:16px; height:16px; accent-color:#5b7cc0; cursor:pointer; }
  .modal-foot{ padding:0 22px 20px; font-size:11px; color:var(--muted); }
</style>
</head>

// Order per latest instruction: Lean -> Formwork & Damp Proof -> Lower Rebar
// -> Grounding (M&E) -> Upper Rebar -> Concrete Pour. Offsets are sequential
// days counting back from the pour date (keys unchanged so old saved
// progress still lines up with the right task).
const STAGES = [
  { key:'lean',      offset:-5, label:'Lean Concrete Pour' },
  { key:'formwork',  offset:-4, label:'Formwork & Damp Proof' },
  { key:'rebarLow',  offset:-3, label:'Lower Rebar' },
  { key:'ground',    offset:-2, label:'Grounding (M&E)' },
  { key:'rebarUp',   offset:-1, label:'Upper Rebar' },
  { key:'pour',      offset: 0, label:'Concrete Pour' },
];

const STORE_KEY = 'pourScheduleProgress_v8';
function loadStore(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }catch(e){ return {}; }
}
function saveStore(s){ localStorage.setItem(STORE_KEY, JSON.stringify(s)); }
let store = loadStore();

// Per-panel pour-date overrides (editable). Stored as {num: 'YYYY-MM-DD'}.
const OVR_KEY = 'pourDateOverrides_v1';
function loadOverrides(){
  try{ return JSON.parse(localStorage.getItem(OVR_KEY)) || {}; }catch(e){ return {}; }
}
function saveOverrides(o){ localStorage.setItem(OVR_KEY, JSON.stringify(o)); }
let overrides = loadOverrides();

// Reference "today" used for overdue checks -- adjustable via the calendar picker.
let refDate = new Date();
refDate.setHours(0,0,0,0);
let calViewYear = refDate.getFullYear();
let calViewMonth = refDate.getMonth();

function parseDDMM(str, year){
  const [d,m] = str.split('/').map(Number);
  return new Date(year, m-1, d);
}
function fmtDDMM(date){ return date.getDate() + '/' + (date.getMonth()+1); }
function formatArea(n){ return n.toFixed(2); }
// Label shown on the panel drawing itself: rounded UP to a whole number,
// with the "2" in "m.2" rendered as a superscript. Kept separate from
// formatArea() above, which still feeds the two-decimal "sq.m." / "cu.m."
// lines in the modal.
function formatAreaLabelHTML(n){
  return Math.ceil(n) + ' m.<sup>2</sup>';
}
function fmtDDMMYYYY(date){
  const dd = String(date.getDate()).padStart(2,'0');
  const mm = String(date.getMonth()+1).padStart(2,'0');
  return dd + '/' + mm + '/' + date.getFullYear();
}
function sameDay(a,b){
  return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
}
function isoDate(date){
  const dd = String(date.getDate()).padStart(2,'0');
  const mm = String(date.getMonth()+1).padStart(2,'0');
  return date.getFullYear() + '-' + mm + '-' + dd;
}

// Effective pour date for a panel: an edited override if present, otherwise
// the original plan date interpreted in the reference date's year.
function effectivePourDate(p){
  const ov = overrides[p.num];
  if(ov){
    const [y,m,d] = ov.split('-').map(Number);
    return new Date(y, m-1, d);
  }
  return parseDDMM(p.date, refDate.getFullYear());
}

function panelProgress(num){
  const rec = store[num] || {};
  let done = 0;
  STAGES.forEach(s => { if(rec[s.key]) done++; });
  return done;
}

// Returns 'done' | 'red' | 'orange' | 'normal'
function panelStatus(p){
  const rec = store[p.num] || {};
  const doneCount = panelProgress(p.num);
  if(doneCount === STAGES.length) return 'done';

  const pourDate = effectivePourDate(p);
  const pourStage = STAGES[STAGES.length - 1];
  if(!rec[pourStage.key] && refDate > pourDate) return 'red';

  let prepOverdue = false;
  STAGES.slice(0, -1).forEach(s => {
    const d = new Date(pourDate); d.setDate(d.getDate() + s.offset);
    if(!rec[s.key] && refDate > d) prepOverdue = true;
  });
  if(prepOverdue) return 'orange';

  return 'normal';
}

/* ===================== Pour-sequence ranking =====================
   rankOrder holds panel numbers in current rank order. Every time we
   resort it (after any date edit), we use a STABLE sort against the
   *previous* rankOrder -- so ties (same date) keep whatever order they
   were in immediately before this edit, per the requirement.
*/
let rankOrder = panels
  .slice()
  .sort((a,b) => parseDDMM(a.date, 2000) - parseDDMM(b.date, 2000))
  .map(p => p.num);

function recomputeRanks(){
  rankOrder.sort((numA, numB) => {
    const pa = panels.find(p => p.num === numA);
    const pb = panels.find(p => p.num === numB);
    return effectivePourDate(pa) - effectivePourDate(pb);
  });
}

function getRank(num){
  const idx = rankOrder.indexOf(num);
  return idx === -1 ? null : idx + 1;
}

function renderPlan(){
  recomputeRanks();
  const wrap = document.getElementById('planWrap');
  wrap.querySelectorAll('.hit, .num-overlay, .date-overlay, .area-overlay').forEach(el => el.remove());

  // Measure the container once per render (not once per overlay -- that was
  // forcing a layout reflow for every single number/date, 88+ times over).
  const wrapRect = wrap.getBoundingClientRect();

  panels.forEach(p => {
    const hit = document.createElement('div');
    hit.className = 'hit';
    hit.style.left = p.l + '%';
    hit.style.top = p.t + '%';
    hit.style.width = p.w + '%';
    hit.style.height = p.h + '%';
    hit.setAttribute('tabindex','0');
    hit.setAttribute('role','button');
    hit.setAttribute('aria-label', 'Panel ' + p.num + ', pour date ' + p.date);
    hit.dataset.panel = p.num;

    const status = panelStatus(p);
    applyStatusColor(hit, status);

    const done = panelProgress(p.num);
    const badge = document.createElement('span');
    badge.className = 'badge' + (done === STAGES.length ? ' done' : '');
    badge.id = 'badge-' + p.num;
    badge.textContent = done + '/' + STAGES.length;
    // Match the badge's footprint to the panel's pour-date box rather than
    // a fixed pixel size, so it stays as small/subtle as the date text
    // instead of looming large over the drawing.
    badge.style.fontSize = boxFontPx(wrapRect, p.dw, p.dh, 0.62, 6);
    hit.appendChild(badge);

    hit.addEventListener('click', () => openModal(p.num));
    hit.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openModal(p.num); }
    });

    wrap.appendChild(hit);

    // Live overlay that replaces the printed sequence number
    const numEl = document.createElement('div');
    numEl.className = 'num-overlay';
    numEl.id = 'num-' + p.num;
    numEl.style.left = p.nl + '%';
    numEl.style.top = p.nt + '%';
    numEl.style.width = p.nw + '%';
    numEl.style.height = p.nh + '%';
    numEl.style.fontSize = boxFontPx(wrapRect, p.nw, p.nh, 0.46, 7);
    numEl.textContent = getRank(p.num);
    wrap.appendChild(numEl);

    // Live overlay that replaces the printed pour-date text
    const dateEl = document.createElement('div');
    dateEl.className = 'date-overlay';
    dateEl.id = 'date-' + p.num;
    dateEl.style.left = p.dl + '%';
    dateEl.style.top = p.dt + '%';
    dateEl.style.width = p.dw + '%';
    dateEl.style.height = p.dh + '%';
    dateEl.style.fontSize = boxFontPx(wrapRect, p.dw, p.dh, 0.62, 7);
    dateEl.textContent = fmtDDMM(effectivePourDate(p));
    wrap.appendChild(dateEl);

    // Area label -- placed in whichever blank band of the panel cell is
    // actually free (top strip, the gap between the number and date boxes,
    // or the bottom strip), so it never overlaps the num-overlay or
    // date-overlay. Font size matches the pour-date text.
    if(p.area != null){
      const band = findAreaBand(p);
      const areaEl = document.createElement('div');
      areaEl.className = 'area-overlay';
      areaEl.id = 'area-' + p.num;
      areaEl.style.left = p.l + '%';
      areaEl.style.top = band.top + '%';
      areaEl.style.width = p.w + '%';
      areaEl.style.height = band.height + '%';
      areaEl.style.fontSize = boxFontPx(wrapRect, p.dw, p.dh, 0.62, 7);
      areaEl.innerHTML = formatAreaLabelHTML(p.area);
      wrap.appendChild(areaEl);
    }
  });
  updateTotal();
}

// Convert a box's registered width/height (each a % of the container) into
// a font-size in real rendered pixels, using the container's actual size --
// this is what keeps every overlay pinned to a sane, legible size instead
// of ballooning to fill the panel regardless of window width.
function boxFontPx(wrapRect, wPct, hPct, factor, minPx){
  const boxPx = Math.min(wrapRect.width * (wPct / 100), wrapRect.height * (hPct / 100));
  return Math.max(minPx, boxPx * factor) + 'px';
}

// Finds an open vertical band (full panel width) inside panel p that does
// not overlap the num-overlay or date-overlay boxes, so the area label can
// be dropped into whatever blank space the panel actually has instead of
// always assuming the top strip is free (some rows have their number box
// positioned high enough that the old fixed top strip ran straight through
// it). Falls back to the top strip if, for some reason, nothing else fits.
function findAreaBand(p){
  const margin = 0.35; // gap kept clear around neighboring boxes, in % units
  const panelTop = p.t, panelBottom = p.t + p.h;

  const boxes = [
    { top: p.nt, bottom: p.nt + p.nh },
    { top: p.dt, bottom: p.dt + p.dh }
  ].sort((a, b) => a.top - b.top);

  const candidates = [
    { top: panelTop, bottom: boxes[0].top - margin },
    { top: boxes[0].bottom + margin, bottom: boxes[1].top - margin },
    { top: Math.max(boxes[0].bottom, boxes[1].bottom) + margin, bottom: panelBottom }
  ].map(b => ({ top: b.top, bottom: b.bottom, height: b.bottom - b.top }))
   .filter(b => b.height > 1.5); // ignore slivers too small to hold text

  if(candidates.length === 0){
    // Nothing cleanly free -- fall back to the old top-strip behavior.
    return { top: panelTop, height: p.h * 0.32 };
  }

  candidates.sort((a, b) => b.height - a.height);
  const best = candidates[0];
  const height = Math.min(best.height, p.h * 0.32 || best.height);
  return { top: best.top, height };
}

function applyStatusColor(hit, status){
  const colors = { orange:'#f0b878', red:'#d1483a', done:'#c7cbd1' };
  hit.style.background = colors[status] || 'transparent';
}

function updateTotal(){
  let total = 0;
  panels.forEach(p => { total += panelProgress(p.num); });
  const totalTasks = panels.length * STAGES.length;
  document.getElementById('progressTotal').textContent =
    'Total progress: ' + total + ' / ' + totalTasks + ' tasks';
}

function refreshPanelVisual(num){
  const p = panels.find(pp => pp.num === num);
  const hit = document.querySelector('.hit[data-panel="' + num + '"]');
  const done = panelProgress(num);
  const badge = document.getElementById('badge-' + num);
  if(badge){
    badge.textContent = done + '/' + STAGES.length;
    badge.classList.toggle('done', done === STAGES.length);
  }
  if(hit && p){
    applyStatusColor(hit, panelStatus(p));
  }
}

let currentModalPanel = null;

function openModal(num){
  currentModalPanel = num;
  const p = panels.find(pp => pp.num === num);
  const pourDate = effectivePourDate(p);
  const rec = store[num] || {};

  const clearBtn = document.getElementById('clearAllBtn');
  if(clearBtn){ clearBtn.classList.remove('confirming'); clearBtn.textContent = 'Clear All'; }
  document.getElementById('editCalPop').style.display = 'none';

  document.getElementById('modalTitle').textContent = 'Panel ' + num;
  document.getElementById('modalSub').textContent =
    'Main pour date: ' + fmtDDMM(pourDate) + '/' + pourDate.getFullYear();
  document.getElementById('rankLine').textContent =
    'Pour sequence: #' + getRank(num) + ' of ' + panels.length;

  if(p.area != null){
    document.getElementById('modalVolumeLine').textContent =
      'Volume ' + formatArea(p.area * 0.30) + ' cu.m.';
    document.getElementById('modalAreaLine').textContent =
      'Area ' + formatArea(p.area) + ' sq.m.';
  } else {
    document.getElementById('modalVolumeLine').textContent = 'Volume \u2014';
    document.getElementById('modalAreaLine').textContent = 'Area \u2014';
  }

  renderTimeline(p, pourDate, rec);

  document.getElementById('modalFoot').textContent =
    'Check off each step to save progress (auto-saved in this browser).';

  document.getElementById('overlay').classList.add('open');
}

function renderTimeline(p, pourDate, rec){
  const tl = document.getElementById('timeline');
  tl.innerHTML = '';
  STAGES.forEach(stage => {
    const d = new Date(pourDate);
    d.setDate(d.getDate() + stage.offset);

    const step = document.createElement('div');
    step.className = 'step';

    const idx = document.createElement('div');
    idx.className = 'idx';
    idx.textContent = STAGES.indexOf(stage) + 1;
    step.appendChild(idx);

    const body = document.createElement('div');
    body.className = 'body';

    const label = document.createElement('label');
    label.className = 'chk';

    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = !!rec[stage.key];

    const textWrap = document.createElement('div');
    const lbl = document.createElement('div');
    lbl.className = 'label';
    lbl.textContent = stage.label;
    const dt = document.createElement('div');
    const isOverdue = !rec[stage.key] && refDate > d;
    dt.className = 'date' + (isOverdue ? ' overdue' : '');
    dt.textContent = fmtDDMM(d) + '/' + pourDate.getFullYear() + (isOverdue ? '  (overdue)' : '');

    cb.addEventListener('change', () => {
      if(!store[p.num]) store[p.num] = {};
      store[p.num][stage.key] = cb.checked;
      saveStore(store);
      refreshPanelVisual(p.num);
      updateTotal();
      const stillOverdue = !cb.checked && refDate > d;
      dt.classList.toggle('overdue', stillOverdue);
      dt.textContent = fmtDDMM(d) + '/' + pourDate.getFullYear() + (stillOverdue ? '  (overdue)' : '');
    });

    textWrap.appendChild(lbl);
    textWrap.appendChild(dt);
    label.appendChild(cb);
    label.appendChild(textWrap);
    body.appendChild(label);
    step.appendChild(body);
    tl.appendChild(step);
  });
}

document.getElementById('closeBtn').addEventListener('click', () => {
  document.getElementById('overlay').classList.remove('open');
});
document.getElementById('overlay').addEventListener('click', (e) => {
  if(e.target.id === 'overlay') document.getElementById('overlay').classList.remove('open');
});
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape'){
    document.getElementById('overlay').classList.remove('open');
    document.getElementById('calPop').classList.remove('open');
    document.getElementById('editCalPop').style.display = 'none';
  }
});

let clearConfirmTimer = null;
document.getElementById('clearAllBtn').addEventListener('click', () => {
  if(currentModalPanel === null) return;
  const btn = document.getElementById('clearAllBtn');

  if(!btn.classList.contains('confirming')){
    btn.classList.add('confirming');
    btn.textContent = 'Click again to confirm';
    clearConfirmTimer = setTimeout(() => {
      btn.classList.remove('confirming');
      btn.textContent = 'Clear All';
    }, 3000);
    return;
  }

  clearTimeout(clearConfirmTimer);
  btn.classList.remove('confirming');
  btn.textContent = 'Clear All';

  store[currentModalPanel] = {};
  saveStore(store);

  const p = panels.find(pp => pp.num === currentModalPanel);
  const pourDate = effectivePourDate(p);
  renderTimeline(p, pourDate, {});

  refreshPanelVisual(currentModalPanel);
  updateTotal();
});

/* ===================== Reference-date calendar picker ===================== */
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW_NAMES = ['Su','Mo','Tu','We','Th','Fr','Sa'];

function updateDateBtn(){
  document.getElementById('dateDisplay').textContent = fmtDDMMYYYY(refDate);
}

function buildCalendarGrid(gridEl, titleEl, viewYear, viewMonth, selectedDate, onPick){
  titleEl.textContent = MONTH_NAMES[viewMonth] + ' ' + viewYear;
  gridEl.innerHTML = '';
  DOW_NAMES.forEach(d => {
    const el = document.createElement('div');
    el.className = 'dow';
    el.textContent = d;
    gridEl.appendChild(el);
  });

  const firstOfMonth = new Date(viewYear, viewMonth, 1);
  const startOffset = firstOfMonth.getDay();
  const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
  const daysInPrevMonth = new Date(viewYear, viewMonth, 0).getDate();

  const cells = [];
  for(let i=startOffset-1; i>=0; i--){
    cells.push({ day: daysInPrevMonth - i, muted:true, y:viewYear, m:viewMonth-1 });
  }
  for(let d=1; d<=daysInMonth; d++){
    cells.push({ day:d, muted:false, y:viewYear, m:viewMonth });
  }
  let nextDay = 1;
  while(cells.length % 7 !== 0){
    cells.push({ day: nextDay++, muted:true, y:viewYear, m:viewMonth+1 });
  }

  const realToday = new Date(); realToday.setHours(0,0,0,0);

  cells.forEach(c => {
    const cellDate = new Date(c.y, c.m, c.day);
    const el = document.createElement('div');
    el.className = 'day' + (c.muted ? ' muted' : '');
    if(sameDay(cellDate, realToday)) el.classList.add('today-marker');
    if(selectedDate && sameDay(cellDate, selectedDate)) el.classList.add('selected');
    el.textContent = c.day;
    el.addEventListener('click', () => onPick(cellDate));
    gridEl.appendChild(el);
  });
}

function renderCalendar(){
  buildCalendarGrid(
    document.getElementById('calGrid'),
    document.getElementById('calTitle'),
    calViewYear, calViewMonth, refDate,
    (cellDate) => {
      refDate = cellDate; refDate.setHours(0,0,0,0);
      updateDateBtn();
      document.getElementById('calPop').classList.remove('open');
      renderPlan();
    }
  );
}

document.getElementById('dateBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  calViewYear = refDate.getFullYear();
  calViewMonth = refDate.getMonth();
  renderCalendar();
  document.getElementById('calPop').classList.toggle('open');
});
document.getElementById('calPrev').addEventListener('click', (e) => {
  e.stopPropagation();
  calViewMonth--; if(calViewMonth < 0){ calViewMonth = 11; calViewYear--; }
  renderCalendar();
});
document.getElementById('calNext').addEventListener('click', (e) => {
  e.stopPropagation();
  calViewMonth++; if(calViewMonth > 11){ calViewMonth = 0; calViewYear++; }
  renderCalendar();
});
document.getElementById('calToday').addEventListener('click', (e) => {
  e.stopPropagation();
  refDate = new Date(); refDate.setHours(0,0,0,0);
  calViewYear = refDate.getFullYear(); calViewMonth = refDate.getMonth();
  updateDateBtn(); renderCalendar(); renderPlan();
});
document.addEventListener('click', (e) => {
  const pop = document.getElementById('calPop');
  const btn = document.getElementById('dateBtn');
  if(pop.classList.contains('open') && !pop.contains(e.target) && !btn.contains(e.target)){
    pop.classList.remove('open');
  }
});
document.getElementById('calPop').addEventListener('click', (e) => e.stopPropagation());

/* ===================== Per-panel pour-date edit calendar ===================== */
let editCalYear = refDate.getFullYear();
let editCalMonth = refDate.getMonth();

function renderEditCalendar(){
  if(currentModalPanel === null) return;
  const p = panels.find(pp => pp.num === currentModalPanel);
  const currentDate = effectivePourDate(p);
  buildCalendarGrid(
    document.getElementById('editCalGrid'),
    document.getElementById('editCalTitle'),
    editCalYear, editCalMonth, currentDate,
    (cellDate) => {
      overrides[currentModalPanel] = isoDate(cellDate);
      saveOverrides(overrides);
      document.getElementById('editCalPop').style.display = 'none';
      // Recompute ranks & repaint the plan (dynamic number/date overlays,
      // status colors) BEFORE reopening the modal so everything -- including
      // the "Pour sequence: #N" line -- reflects the edit immediately.
      renderPlan();
      openModal(currentModalPanel);
    }
  );
}

document.getElementById('editDateBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  if(currentModalPanel === null) return;
  const p = panels.find(pp => pp.num === currentModalPanel);
  const currentDate = effectivePourDate(p);
  editCalYear = currentDate.getFullYear();
  editCalMonth = currentDate.getMonth();
  renderEditCalendar();
  const pop = document.getElementById('editCalPop');
  pop.style.display = (pop.style.display === 'none') ? 'block' : 'none';
});
document.getElementById('editCalPrev').addEventListener('click', (e) => {
  e.stopPropagation();
  editCalMonth--; if(editCalMonth < 0){ editCalMonth = 11; editCalYear--; }
  renderEditCalendar();
});
document.getElementById('editCalNext').addEventListener('click', (e) => {
  e.stopPropagation();
  editCalMonth++; if(editCalMonth > 11){ editCalMonth = 0; editCalYear++; }
  renderEditCalendar();
});

document.getElementById('planImg').addEventListener('load', renderPlan);
if(document.getElementById('planImg').complete) renderPlan();
updateDateBtn();

let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(renderPlan, 120);
});
</script>
