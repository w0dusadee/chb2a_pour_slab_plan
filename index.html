<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHB2A-DOLPHIN | FSA-DCH Concrete Pour Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0b2440;
    --navy-2:#123258;
    --paper:#f4f1e8;
    --paper-line:#c9c2ab;
    --blue-deep:#5b7cc0;
    --yellow-deep:#e0c94a;
    --red:#c0392b;
    --ink:#0b2440;
    --muted:#5c6b7a;
    --white:#ffffff;
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--navy);
    font-family:'IBM Plex Mono',monospace;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  header{
    background:linear-gradient(180deg,var(--navy) 0%, var(--navy-2) 100%);
    color:var(--paper);
    padding:10px 16px 10px;
    border-bottom:3px solid var(--yellow-deep);
    flex:0 0 auto;
    position:relative;
    z-index:100;
  }
  .eyebrow{
    font-size:10px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:#8ea9db;
    margin:0 0 3px;
  }
  h1{ margin:0; font-size:16px; font-weight:600; letter-spacing:.005em; }
  .toolbar{ display:flex; flex-wrap:wrap; gap:14px; align-items:center; margin-top:8px; }

  .date-picker{ position:relative; }
  .date-btn{
    display:flex; align-items:center; gap:8px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.18);
    padding:5px 9px; border-radius:4px;
    font-size:11px;
    color:var(--paper);
    cursor:pointer;
    font-family:'IBM Plex Mono',monospace;
  }
  .date-btn:hover{ background:rgba(255,255,255,.12); }
  .date-btn b{ font-size:12px; }
  .date-btn .cal-ico{ font-size:12px; opacity:.8; }

  .cal-pop{
    position:absolute;
    top:calc(100% + 6px);
    left:0;
    width:240px;
    background:var(--paper);
    color:var(--ink);
    border-radius:8px;
    box-shadow:0 16px 40px rgba(0,0,0,.4);
    border:1px solid var(--paper-line);
    padding:10px;
    display:none;
    z-index:200;
  }
  .cal-pop.open{ display:block; }
  .cal-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:6px;
  }
  .cal-head button{
    background:none; border:none; cursor:pointer;
    font-size:14px; color:var(--navy); padding:2px 8px;
    border-radius:4px;
  }
  .cal-head button:hover{ background:rgba(11,36,64,.08); }
  .cal-head .cal-title{ font-size:12px; font-weight:700; }
  .cal-grid{
    display:grid; grid-template-columns:repeat(7,1fr);
    gap:2px; font-size:10.5px;
  }
  .cal-grid .dow{ text-align:center; color:var(--muted); font-weight:700; padding:2px 0; }
  .cal-grid .day{
    text-align:center; padding:5px 0; cursor:pointer; border-radius:4px;
  }
  .cal-grid .day:hover{ background:rgba(91,124,192,.25); }
  .cal-grid .day.muted{ color:#b7b0a0; }
  .cal-grid .day.today-marker{ box-shadow:inset 0 0 0 1px var(--blue-deep); }
  .cal-grid .day.selected{ background:var(--navy); color:#f5e07a; font-weight:700; }
  .cal-foot{
    margin-top:8px; text-align:center;
  }
  .cal-foot button{
    background:none; border:none; font-size:10.5px; color:var(--blue-deep);
    cursor:pointer; text-decoration:underline;
  }

  .legend{ display:flex; flex-wrap:wrap; gap:12px; font-size:10.5px; color:#c7d3e2; align-items:center; }
  .legend .row{ display:flex; align-items:center; }
  .legend span.swatch{
    display:inline-block; width:11px; height:11px; border-radius:2px;
    margin-right:5px; vertical-align:-2px; border:1px solid rgba(0,0,0,.2);
  }
  .progress-total{
    margin-left:auto;
    font-size:11px; color:#f5e07a;
    background:rgba(0,0,0,.2); padding:5px 11px; border-radius:4px;
    border:1px solid rgba(255,255,255,.12);
  }

  .stage{
    flex:1 1 auto;
    padding:10px;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    overflow:auto;
  }
  .plan-wrap{
    position:relative;
    background:var(--paper);
    border-radius:4px;
    width:100%;
    max-width:100%;
    margin:0 auto;
    box-shadow:0 8px 24px rgba(0,0,0,.35);
    overflow:hidden;
    line-height:0;
  }
  .plan-wrap img{ display:block; width:100%; height:auto; user-select:none; -webkit-user-drag:none; }

  .hit{
    position:absolute;
    border:1px solid transparent;
    cursor:pointer;
    background-repeat:no-repeat;
    transition:box-shadow .12s ease, filter .12s ease;
  }
  .hit:hover{ filter:brightness(0.96); box-shadow:inset 0 0 0 2px rgba(11,36,64,.55); }
  .hit:focus-visible{ outline:none; box-shadow:inset 0 0 0 2px var(--navy); }

  .badge{
    position:absolute;
    top:3px; right:3px;
    font-size:10px;
    font-weight:700;
    padding:1px 5px;
    border-radius:8px;
    background:rgba(255,255,255,.85);
    color:var(--muted);
    pointer-events:none;
    border:1px solid rgba(0,0,0,.15);
  }
  .badge.done{ background:var(--navy); color:#f5e07a; border-color:var(--navy); }

  /* Modal */
  .overlay{
    position:fixed; inset:0; background:rgba(11,36,64,.6);
    display:none; align-items:center; justify-content:center;
    z-index:300; padding:18px;
  }
  .overlay.open{ display:flex; }
  .modal{
    background:var(--paper); border-radius:8px; width:100%; max-width:440px;
    max-height:88vh; overflow-y:auto; box-shadow:0 24px 60px rgba(0,0,0,.45);
    border-top:5px solid var(--red);
    font-family:'IBM Plex Mono',monospace;
  }
  .modal-head{
    padding:18px 22px 12px; display:flex; justify-content:space-between;
    align-items:flex-start; border-bottom:1px dashed var(--paper-line);
  }
  .modal-head h2{ margin:0 0 4px; font-size:17px; }
  .modal-head p{ margin:0; font-size:12px; color:var(--muted); }
  .modal-head button{
    background:none; border:none; font-size:20px; cursor:pointer;
    color:var(--muted); line-height:1; padding:2px 4px;
  }
  .modal-head-actions{
    display:flex; align-items:flex-start; gap:10px; flex-shrink:0;
  }
  .clear-all-btn{
    font-size:11px !important;
    color:var(--red-late,#d1483a) !important;
    border:1px solid rgba(209,72,58,.4) !important;
    border-radius:4px;
    padding:5px 9px !important;
    line-height:1.2 !important;
    white-space:nowrap;
  }
  .clear-all-btn:hover{
    background:rgba(209,72,58,.12) !important;
  }
  .clear-all-btn.confirming{
    background:var(--red-late,#d1483a) !important;
    color:#fff !important;
    border-color:var(--red-late,#d1483a) !important;
  }
  .timeline{ padding:16px 22px 22px; }
  .step{ display:flex; gap:12px; padding:10px 0; border-bottom:1px solid #e6e0cc; }
  .step:last-child{
    border-bottom:none; background:rgba(240,201,74,.25);
    margin:0 -22px; padding:12px 22px; border-radius:6px;
  }
  .step .idx{
    font-size:11px; color:var(--white);
    background:var(--blue-deep); width:20px; height:20px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:2px;
  }
  .step:last-child .idx{ background:var(--red); }
  .step .body{ flex:1; }
  .step .label{ font-weight:600; font-size:13px; }
  .step .date{ font-size:12px; color:var(--muted); margin-top:2px; }
  .step .date.overdue{ color:#d1483a; font-weight:700; }
  .step label.chk{ display:flex; align-items:center; gap:6px; cursor:pointer; }
  .step input[type=checkbox]{ width:16px; height:16px; accent-color:#5b7cc0; cursor:pointer; }
  .modal-foot{ padding:0 22px 20px; font-size:11px; color:var(--muted); }
</style>
</head>

const STAGES = [
  { key:'lean',      offset:-5, label:'Lean Concrete Pour' },
  { key:'rebarLow',  offset:-4, label:'Lower Rebar' },
  { key:'ground',    offset:-3, label:'Grounding (M&E)' },
  { key:'rebarUp',   offset:-2, label:'Upper Rebar' },
  { key:'formwork',  offset:-1, label:'Formwork' },
  { key:'pour',      offset: 0, label:'Concrete Pour' },
];

const STATUS_TINT = {
  orange: 'rgba(240,184,120,0.55)',
  red:    'rgba(209,72,58,0.55)',
  done:   'rgba(199,203,209,0.65)',
};

const STORE_KEY = 'pourScheduleProgress_v7';
function loadStore(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }catch(e){ return {}; }
}
function saveStore(s){ localStorage.setItem(STORE_KEY, JSON.stringify(s)); }
let store = loadStore();

// Reference "today" used for overdue checks -- adjustable via the calendar picker.
let refDate = new Date();
refDate.setHours(0,0,0,0);
let calViewYear = refDate.getFullYear();
let calViewMonth = refDate.getMonth();

function parseDDMM(str, year){
  const [d,m] = str.split('/').map(Number);
  return new Date(year, m-1, d);
}
function fmtDDMM(date){ return date.getDate() + '/' + (date.getMonth()+1); }
function fmtDDMMYYYY(date){
  const dd = String(date.getDate()).padStart(2,'0');
  const mm = String(date.getMonth()+1).padStart(2,'0');
  return dd + '/' + mm + '/' + date.getFullYear();
}
function sameDay(a,b){
  return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
}

function panelProgress(num){
  const rec = store[num] || {};
  let done = 0;
  STAGES.forEach(s => { if(rec[s.key]) done++; });
  return done;
}

// Returns 'done' | 'red' | 'orange' | 'normal'
function panelStatus(p){
  const rec = store[p.num] || {};
  const doneCount = panelProgress(p.num);
  if(doneCount === STAGES.length) return 'done';

  const pourDate = parseDDMM(p.date, refDate.getFullYear());
  const pourStage = STAGES[STAGES.length - 1];
  if(!rec[pourStage.key] && refDate > pourDate) return 'red';

  let prepOverdue = false;
  STAGES.slice(0, -1).forEach(s => {
    const d = new Date(pourDate); d.setDate(d.getDate() + s.offset);
    if(!rec[s.key] && refDate > d) prepOverdue = true;
  });
  if(prepOverdue) return 'orange';

  return 'normal';
}

// Paints a "window" of the transparent-fill drawing behind a translucent tint,
// cropped+scaled so it lines up exactly with the original artwork underneath.
function applyStatusPaint(hit, p, status){
  if(status === 'normal' || status === undefined){
    hit.style.background = '';
    return;
  }
  const sizeX = (10000 / p.w).toFixed(3);
  const sizeY = (10000 / p.h).toFixed(3);
  const posX = (100 * p.l / (100 - p.w)).toFixed(3);
  const posY = (100 * p.t / (100 - p.h)).toFixed(3);
  const tint = STATUS_TINT[status];
  hit.style.backgroundColor = 'var(--paper)';
  hit.style.backgroundImage = 'linear-gradient(' + tint + ',' + tint + '), url(' + TRANSPARENT_IMG + ')';
  hit.style.backgroundSize = '100% 100%, ' + sizeX + '% ' + sizeY + '%';
  hit.style.backgroundPosition = '0 0, ' + posX + '% ' + posY + '%';
}

function renderPlan(){
  const wrap = document.getElementById('planWrap');
  wrap.querySelectorAll('.hit').forEach(el => el.remove());

  panels.forEach(p => {
    const hit = document.createElement('div');
    hit.className = 'hit';
    hit.style.left = p.l + '%';
    hit.style.top = p.t + '%';
    hit.style.width = p.w + '%';
    hit.style.height = p.h + '%';
    hit.setAttribute('tabindex','0');
    hit.setAttribute('role','button');
    hit.setAttribute('aria-label', 'Panel ' + p.num + ', pour date ' + p.date);
    hit.dataset.panel = p.num;

    applyStatusPaint(hit, p, panelStatus(p));

    const done = panelProgress(p.num);
    const badge = document.createElement('span');
    badge.className = 'badge' + (done === STAGES.length ? ' done' : '');
    badge.id = 'badge-' + p.num;
    badge.textContent = done + '/' + STAGES.length;
    hit.appendChild(badge);

    hit.addEventListener('click', () => openModal(p.num, p.date));
    hit.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openModal(p.num, p.date); }
    });

    wrap.appendChild(hit);
  });
  updateTotal();
}

function updateTotal(){
  let total = 0;
  panels.forEach(p => { total += panelProgress(p.num); });
  const totalTasks = panels.length * STAGES.length;
  document.getElementById('progressTotal').textContent =
    'Total progress: ' + total + ' / ' + totalTasks + ' tasks';
}

function refreshPanelVisual(num){
  const p = panels.find(pp => pp.num === num);
  const hit = document.querySelector('.hit[data-panel="' + num + '"]');
  const done = panelProgress(num);
  const badge = document.getElementById('badge-' + num);
  if(badge){
    badge.textContent = done + '/' + STAGES.length;
    badge.classList.toggle('done', done === STAGES.length);
  }
  if(hit && p){
    applyStatusPaint(hit, p, panelStatus(p));
  }
}

let currentModalPanel = null;

function openModal(num, dateStr){
  currentModalPanel = num;
  const clearBtn = document.getElementById('clearAllBtn');
  if(clearBtn){
    clearBtn.classList.remove('confirming');
    clearBtn.textContent = 'Clear All';
  }
  const pourDate = parseDDMM(dateStr, refDate.getFullYear());
  const rec = store[num] || {};

  document.getElementById('modalTitle').textContent = 'Panel ' + num;
  document.getElementById('modalSub').textContent =
    'Main pour date: ' + fmtDDMM(pourDate) + '/' + refDate.getFullYear();

  const tl = document.getElementById('timeline');
  tl.innerHTML = '';
  STAGES.forEach(stage => {
    const d = new Date(pourDate);
    d.setDate(d.getDate() + stage.offset);

    const step = document.createElement('div');
    step.className = 'step';

    const idx = document.createElement('div');
    idx.className = 'idx';
    idx.textContent = STAGES.indexOf(stage) + 1;
    step.appendChild(idx);

    const body = document.createElement('div');
    body.className = 'body';

    const label = document.createElement('label');
    label.className = 'chk';

    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = !!rec[stage.key];

    const textWrap = document.createElement('div');
    const lbl = document.createElement('div');
    lbl.className = 'label';
    lbl.textContent = stage.label;
    const dt = document.createElement('div');
    const isOverdue = !rec[stage.key] && refDate > d;
    dt.className = 'date' + (isOverdue ? ' overdue' : '');
    dt.textContent = fmtDDMM(d) + '/' + refDate.getFullYear() + (isOverdue ? '  (overdue)' : '');

    cb.addEventListener('change', () => {
      if(!store[num]) store[num] = {};
      store[num][stage.key] = cb.checked;
      saveStore(store);
      refreshPanelVisual(num);
      updateTotal();
      const stillOverdue = !cb.checked && refDate > d;
      dt.classList.toggle('overdue', stillOverdue);
      dt.textContent = fmtDDMM(d) + '/' + refDate.getFullYear() + (stillOverdue ? '  (overdue)' : '');
    });

    textWrap.appendChild(lbl);
    textWrap.appendChild(dt);
    label.appendChild(cb);
    label.appendChild(textWrap);
    body.appendChild(label);
    step.appendChild(body);
    tl.appendChild(step);
  });

  document.getElementById('modalFoot').textContent =
    'Check off each step to save progress (auto-saved in this browser).';

  document.getElementById('overlay').classList.add('open');
}

document.getElementById('closeBtn').addEventListener('click', () => {
  document.getElementById('overlay').classList.remove('open');
});

let clearConfirmTimer = null;
document.getElementById('clearAllBtn').addEventListener('click', () => {
  if(currentModalPanel === null) return;
  const btn = document.getElementById('clearAllBtn');

  if(!btn.classList.contains('confirming')){
    btn.classList.add('confirming');
    btn.textContent = 'Click again to confirm';
    clearConfirmTimer = setTimeout(() => {
      btn.classList.remove('confirming');
      btn.textContent = 'Clear All';
    }, 3000);
    return;
  }

  clearTimeout(clearConfirmTimer);
  btn.classList.remove('confirming');
  btn.textContent = 'Clear All';

  store[currentModalPanel] = {};
  saveStore(store);

  document.querySelectorAll('#timeline .step').forEach(stepEl => {
    const cb = stepEl.querySelector('input[type=checkbox]');
    if(cb) cb.checked = false;
  });

  const p = panels.find(pp => pp.num === currentModalPanel);
  if(p){
    const pourDate = parseDDMM(p.date, refDate.getFullYear());
    document.querySelectorAll('#timeline .step').forEach((stepEl, idx) => {
      const stage = STAGES[idx];
      const dtEl = stepEl.querySelector('.date');
      if(!stage || !dtEl) return;
      const d = new Date(pourDate);
      d.setDate(d.getDate() + stage.offset);
      const isOverdue = refDate > d;
      dtEl.classList.toggle('overdue', isOverdue);
      dtEl.textContent = fmtDDMM(d) + '/' + refDate.getFullYear() + (isOverdue ? '  (overdue)' : '');
    });
  }

  refreshPanelVisual(currentModalPanel);
  updateTotal();
});

document.getElementById('overlay').addEventListener('click', (e) => {
  if(e.target.id === 'overlay') document.getElementById('overlay').classList.remove('open');
});
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape'){
    document.getElementById('overlay').classList.remove('open');
    document.getElementById('calPop').classList.remove('open');
  }
});

const DOW_NAMES = ['Su','Mo','Tu','We','Th','Fr','Sa'];

}

function renderCalendar(){
  document.getElementById('calTitle').textContent = MONTH_NAMES[calViewMonth] + ' ' + calViewYear;
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  DOW_NAMES.forEach(d => {
    const el = document.createElement('div');
    el.className = 'dow';
    el.textContent = d;
    grid.appendChild(el);
  });

  const firstOfMonth = new Date(calViewYear, calViewMonth, 1);
  const startOffset = firstOfMonth.getDay();
  const daysInMonth = new Date(calViewYear, calViewMonth+1, 0).getDate();
  const daysInPrevMonth = new Date(calViewYear, calViewMonth, 0).getDate();

  const cells = [];
  for(let i=startOffset-1; i>=0; i--){
    cells.push({ day: daysInPrevMonth - i, muted:true, y:calViewYear, m:calViewMonth-1 });
  }
  for(let d=1; d<=daysInMonth; d++){
    cells.push({ day:d, muted:false, y:calViewYear, m:calViewMonth });
  }
  let nextDay = 1;
  while(cells.length % 7 !== 0){
    cells.push({ day: nextDay++, muted:true, y:calViewYear, m:calViewMonth+1 });
  }

  const realToday = new Date(); realToday.setHours(0,0,0,0);

  cells.forEach(c => {
    const cellDate = new Date(c.y, c.m, c.day);
    const el = document.createElement('div');
    el.className = 'day' + (c.muted ? ' muted' : '');
    if(sameDay(cellDate, realToday)) el.classList.add('today-marker');
    if(sameDay(cellDate, refDate)) el.classList.add('selected');
    el.textContent = c.day;
    el.addEventListener('click', () => {
      refDate = cellDate;
      refDate.setHours(0,0,0,0);
      updateDateBtn();
      document.getElementById('calPop').classList.remove('open');
      renderPlan();
    });
    grid.appendChild(el);
  });
}

document.getElementById('dateBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  calViewYear = refDate.getFullYear();
  calViewMonth = refDate.getMonth();
  renderCalendar();
  document.getElementById('calPop').classList.toggle('open');
});
document.getElementById('calPrev').addEventListener('click', (e) => {
  e.stopPropagation();
  calViewMonth--;
  if(calViewMonth < 0){ calViewMonth = 11; calViewYear--; }
  renderCalendar();
});
document.getElementById('calNext').addEventListener('click', (e) => {
  e.stopPropagation();
  calViewMonth++;
  if(calViewMonth > 11){ calViewMonth = 0; calViewYear++; }
  renderCalendar();
});
document.getElementById('calToday').addEventListener('click', (e) => {
  e.stopPropagation();
  refDate = new Date(); refDate.setHours(0,0,0,0);
  calViewYear = refDate.getFullYear();
  calViewMonth = refDate.getMonth();
  updateDateBtn();
  renderCalendar();
  renderPlan();
});
document.addEventListener('click', (e) => {
  const pop = document.getElementById('calPop');
  const btn = document.getElementById('dateBtn');
  if(pop.classList.contains('open') && !pop.contains(e.target) && !btn.contains(e.target)){
    pop.classList.remove('open');
  }
});
document.getElementById('calPop').addEventListener('click', (e) => e.stopPropagation());

document.getElementById('planImg').addEventListener('load', renderPlan);
if(document.getElementById('planImg').complete) renderPlan();
updateDateBtn();
</script>
</body>
</html>
